<svg width="760" height="562" viewBox="0 0 760 562" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    .bg     { fill: #0D1117; }
    .tbar   { fill: #161B22; }
    .bord   { fill: none; stroke: #238636; stroke-width: 1.5; }
    .sep    { stroke: #238636; stroke-width: 0.8; fill: none; }
    .sepl   { stroke: #30363D; stroke-width: 0.5; fill: none; }
    .main   { fill: #E6EDF3; }
    .muted  { fill: #8B949E; }
    .green  { fill: #3FB950; }
    .bgreen { fill: #39D353; }
    .blue   { fill: #58A6FF; }
    .dim    { fill: #6E7681; }
    .amber  { fill: #FFA657; }
    @media (prefers-color-scheme: light) {
      .bg     { fill: #FFFFFF; }
      .tbar   { fill: #F6F8FA; }
      .bord   { fill: none; stroke: #1F883D; stroke-width: 1.5; }
      .sep    { stroke: #1F883D; stroke-width: 0.8; fill: none; }
      .sepl   { stroke: #D0D7DE; stroke-width: 0.5; fill: none; }
      .main   { fill: #1F2328; }
      .muted  { fill: #656D76; }
      .green  { fill: #1A7F37; }
      .bgreen { fill: #1F883D; }
      .blue   { fill: #0969DA; }
      .dim    { fill: #848D97; }
      .amber  { fill: #BC4C00; }
    }
  </style>

  <!-- Window background -->
  <rect width="760" height="562" rx="10" class="bg"/>

  <!-- Title bar: rounded top corners only -->
  <path d="M1,10 Q1,1 10,1 H750 Q759,1 759,10 V41 H1 Z" class="tbar"/>

  <!-- Title bar green separator -->
  <line x1="1" y1="41" x2="759" y2="41" class="sep"/>

  <!-- Window green border -->
  <rect x="0.5" y="0.5" width="759" height="561" rx="9.5" class="bord"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#28CA41"/>

  <!-- Title bar label -->
  <text x="380" y="26" text-anchor="middle" font-size="12" class="dim">yashwanth-cli  &#xB7;  v2026.6  &#xB7;  ready</text>

  <!-- ====== Welcome header ====== -->
  <text x="24" y="64" font-size="14" font-weight="bold">
    <tspan class="bgreen">&#x273B;</tspan><tspan class="main"> Welcome to yashwanth-cli</tspan><tspan class="dim" font-size="12" font-weight="normal">   esc to interrupt</tspan>
  </text>

  <!-- Thin separator below header -->
  <line x1="24" y1="76" x2="736" y2="76" class="sepl"/>

  <!-- ====== Turn 1: whoami ====== -->
  <text x="24" y="100" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> whoami</tspan>
  </text>
  <text x="24" y="121" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="muted"> profile.load() ...</tspan>
  </text>
  <text x="24" y="142" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="main" font-weight="bold">Yashwanth Reddy Katipally</tspan>
  </text>
  <text x="24" y="163" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="muted">AI Engineer </tspan><tspan class="dim">&#xB7;</tspan><tspan class="muted"> multi-agent systems</tspan>
  </text>
  <text x="24" y="184" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="muted">San Jose, CA </tspan><tspan class="dim">&#xB7;</tspan><tspan class="muted"> SJSU '26 (Applied Data Intelligence)</tspan>
  </text>

  <!-- ====== Turn 2: why ====== -->
  <text x="24" y="212" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> why do you build?</tspan>
  </text>
  <text x="24" y="233" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="muted"> thinking...</tspan>
  </text>
  <text x="24" y="254" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="main">i hunt the boring parts of your day and throw</tspan>
  </text>
  <text x="24" y="275" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="main">an agent at them until they stop existing fr</tspan>
  </text>

  <!-- ====== Turn 3: skills ====== -->
  <text x="24" y="303" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> cat skills.txt</tspan>
  </text>
  <text x="24" y="324" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="blue">custom agent harnesses </tspan><tspan class="dim">&#xB7;</tspan><tspan class="blue"> MCP servers + clients</tspan>
  </text>
  <text x="24" y="345" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="blue">RAG + hybrid retrieval </tspan><tspan class="dim">&#xB7;</tspan><tspan class="blue"> multi-agent orchestration</tspan>
  </text>
  <text x="24" y="366" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="blue">tool-use + structured outputs </tspan><tspan class="dim">&#xB7;</tspan><tspan class="blue"> LLM evals + guardrails</tspan>
  </text>
  <text x="24" y="387" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="blue">context engineering </tspan><tspan class="dim">&#xB7;</tspan><tspan class="blue"> fine-tuning </tspan><tspan class="dim">&#xB7;</tspan><tspan class="blue"> agentic eval harnesses</tspan>
  </text>

  <!-- ====== Turn 4: status ====== -->
  <text x="24" y="415" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> ./status --hire</tspan>
  </text>
  <text x="24" y="436" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="main"> OPEN_TO_WORK = </tspan><tspan class="bgreen" font-weight="bold">true</tspan>
  </text>
  <text x="24" y="457" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="amber">built different, but the kind that actually ships.</tspan>
  </text>

  <!-- ====== Turn 5: the joke ====== -->
  <text x="24" y="485" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> touch grass</tspan>
  </text>
  <text x="24" y="506" font-size="13">
    <tspan class="amber">&#x25CF;</tspan><tspan class="muted"> command not found: grass</tspan>
  </text>
  <text x="24" y="527" font-size="13">
    <tspan class="dim">  &#x23BF; </tspan><tspan class="main">wait is that a new agent framework?? lmk</tspan>
  </text>

  <!-- ====== Final prompt + blinking cursor ====== -->
  <text x="24" y="555" font-size="13">
    <tspan class="bgreen">&gt; </tspan>
  </text>
  <rect x="40" y="541" width="8" height="16" rx="1" class="bgreen" fill="#39D353">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>

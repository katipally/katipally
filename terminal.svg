<svg width="760" height="468" viewBox="0 0 760 468" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    .bg     { fill: #0D1117; }
    .tbar   { fill: #161B22; }
    .bord   { fill: none; stroke: #238636; stroke-width: 1.5; }
    .sep    { stroke: #238636; stroke-width: 0.8; fill: none; }
    .sepl   { stroke: #30363D; stroke-width: 0.5; fill: none; }
    .main   { fill: #E6EDF3; }
    .muted  { fill: #8B949E; }
    .green  { fill: #3FB950; }
    .bgreen { fill: #39D353; }
    .blue   { fill: #58A6FF; }
    .dim    { fill: #6E7681; }
    .amber  { fill: #FFA657; }
    @media (prefers-color-scheme: light) {
      .bg     { fill: #FFFFFF; }
      .tbar   { fill: #F6F8FA; }
      .bord   { fill: none; stroke: #1F883D; stroke-width: 1.5; }
      .sep    { stroke: #1F883D; stroke-width: 0.8; fill: none; }
      .sepl   { stroke: #D0D7DE; stroke-width: 0.5; fill: none; }
      .main   { fill: #1F2328; }
      .muted  { fill: #656D76; }
      .green  { fill: #1A7F37; }
      .bgreen { fill: #1F883D; }
      .blue   { fill: #0969DA; }
      .dim    { fill: #848D97; }
      .amber  { fill: #BC4C00; }
    }
  </style>

  <!-- Window background -->
  <rect width="760" height="468" rx="10" class="bg"/>

  <!-- Title bar: rounded top corners only -->
  <path d="M1,10 Q1,1 10,1 H750 Q759,1 759,10 V41 H1 Z" class="tbar"/>

  <!-- Title bar green separator -->
  <line x1="1" y1="41" x2="759" y2="41" class="sep"/>

  <!-- Window green border -->
  <rect x="0.5" y="0.5" width="759" height="467" rx="9.5" class="bord"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#28CA41"/>

  <!-- Title bar: agent label -->
  <text x="380" y="26" text-anchor="middle" font-size="12" class="dim">yashwanth agent  --  v1.0.0  --  ready</text>

  <!-- ====== Agent header: ✻ name + version ====== -->
  <text x="24" y="64" font-size="14" font-weight="bold">
    <tspan class="bgreen">&#x273B;</tspan><tspan class="main"> yashwanth</tspan><tspan class="dim" font-size="12" font-weight="normal">  v1.0.0</tspan>
  </text>

  <!-- Thin horizontal separator below header -->
  <line x1="24" y1="76" x2="736" y2="76" class="sepl"/>

  <!-- ====== ASCII mascot (5 rows) ====== -->
  <text x="24" y="98"  font-size="13" class="dim">  &#x256D;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x256E;</text>
  <text x="24" y="118" font-size="13"><tspan class="dim">  &#x2502;  </tspan><tspan class="green">&#x25CF;</tspan><tspan class="dim">   </tspan><tspan class="green">&#x25CF;</tspan><tspan class="dim">  &#x2502;</tspan></text>
  <text x="24" y="138" font-size="13" class="dim">  &#x2502;  &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;  &#x2502;</text>
  <text x="24" y="158" font-size="13" class="dim">  &#x2570;&#x2500;&#x2500;&#x2500;&#x2500;&#x252C;&#x2500;&#x2500;&#x2500;&#x2500;&#x256F;</text>
  <text x="24" y="178" font-size="13" class="dim">       &#x2502;</text>

  <!-- Right-side info aligned with mascot rows 2-4 -->
  <text x="158" y="118" font-size="13" class="main" font-weight="bold">AI/ML Engineer</text>
  <text x="158" y="138" font-size="13" class="muted">Recent grad from SJSU</text>
  <text x="158" y="158" font-size="13" class="dim">Applied Data Intelligence  &#xB7;  San Jose, CA</text>

  <!-- ====== Bullet 1: problem space ====== -->
  <text x="24" y="202" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="main"> Analyzing problem space...</tspan>
  </text>
  <text x="24" y="221" font-size="13">
    <tspan class="dim">  &#x2514; </tspan><tspan class="muted">gaps found: </tspan><tspan class="bgreen">many</tspan><tspan class="muted">. patches shipped: </tspan><tspan class="bgreen">more</tspan><tspan class="muted">. bugs introduced: </tspan><tspan class="amber">inevitably</tspan><tspan class="dim">.</tspan>
  </text>

  <!-- ====== Bullet 2: background ====== -->
  <text x="24" y="248" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="main"> Loading background...</tspan>
  </text>
  <text x="24" y="267" font-size="13">
    <tspan class="dim">  &#x2514; </tspan><tspan class="muted">Recent grad from SJSU (Applied Data Intelligence).</tspan>
  </text>
  <text x="24" y="286" font-size="13">
    <tspan class="dim">  &#x2514; </tspan><tspan class="muted">I find gaps in systems, figure out why they exist, and close them.</tspan>
  </text>

  <!-- ====== Bullet 3: availability ====== -->
  <text x="24" y="313" font-size="13">
    <tspan class="green">&#x25CF;</tspan><tspan class="main"> Checking availability...</tspan>
  </text>
  <text x="24" y="332" font-size="13">
    <tspan class="dim">  &#x2514; </tspan><tspan class="main">OPEN_TO_WORK=</tspan><tspan class="bgreen">true</tspan><tspan class="dim">  # hire me before someone else does</tspan>
  </text>

  <!-- ====== Contact prompt ====== -->
  <text x="24" y="359" font-size="13">
    <tspan class="bgreen">&gt;</tspan><tspan class="main"> cat contact.txt</tspan>
  </text>
  <text x="24" y="378" font-size="13">
    <tspan class="dim">    </tspan><tspan class="muted">email     </tspan><tspan class="blue">yashwanthreddykatipally@gmail.com</tspan>
  </text>
  <text x="24" y="397" font-size="13">
    <tspan class="dim">    </tspan><tspan class="muted">linkedin  </tspan><tspan class="blue">yashwanth-katipally</tspan>
  </text>
  <text x="24" y="416" font-size="13">
    <tspan class="dim">    </tspan><tspan class="muted">web       </tspan><tspan class="blue">yashwanth.net</tspan>
  </text>

  <!-- ====== Final prompt + blinking cursor ====== -->
  <text x="24" y="447" font-size="13">
    <tspan class="bgreen">&gt; </tspan>
  </text>
  <!-- cursor: ">" + " " = 2 chars x 7.8px = 15.6px → rect x = 24+16 = 40 -->
  <rect x="40" y="433" width="8" height="16" rx="1" fill="#39D353" class="bgreen">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    .bg     { fill: #0D1117; }
    .tbar   { fill: #161B22; }
    .bord   { fill: none; stroke: #238636; stroke-width: 1.5; }
    .sep    { stroke: #238636; stroke-width: 0.8; fill: none; }
    .main   { fill: #E6EDF3; }
    .muted  { fill: #8B949E; }
    .green  { fill: #3FB950; }
    .bgreen { fill: #39D353; }
    .blue   { fill: #58A6FF; }
    .dim    { fill: #6E7681; }
    @media (prefers-color-scheme: light) {
      .bg     { fill: #FFFFFF; }
      .tbar   { fill: #F6F8FA; }
      .bord   { fill: none; stroke: #1F883D; stroke-width: 1.5; }
      .sep    { stroke: #1F883D; stroke-width: 0.8; fill: none; }
      .main   { fill: #1F2328; }
      .muted  { fill: #656D76; }
      .green  { fill: #1A7F37; }
      .bgreen { fill: #1F883D; }
      .blue   { fill: #0969DA; }
      .dim    { fill: #848D97; }
    }
  </style>

  <!-- Window background -->
  <rect width="760" height="440" rx="10" class="bg"/>

  <!-- Title bar: rounded top corners only via path -->
  <path d="M1,10 Q1,1 10,1 H750 Q759,1 759,10 V41 H1 Z" class="tbar"/>

  <!-- Title bar separator -->
  <line x1="1" y1="41" x2="759" y2="41" class="sep"/>

  <!-- Window border (drawn on top) -->
  <rect x="0.5" y="0.5" width="759" height="439" rx="9.5" class="bord"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#28CA41"/>

  <!-- Title bar label -->
  <text x="380" y="26" text-anchor="middle" font-size="12" class="dim">zsh  --  katipally  --  80x24</text>

  <!-- ======== $ whoami ======== -->
  <text x="20" y="67" font-size="13">
    <tspan class="green">yashwanth@sjsu</tspan><tspan class="dim"> ~ </tspan><tspan class="bgreen">%</tspan><tspan class="main"> whoami</tspan>
  </text>
  <text y="87" font-size="13">
    <tspan x="20" class="main">yashwanth  </tspan><tspan class="dim">·  recent grad from SJSU  ·  </tspan><tspan class="green">AI/ML Engineer</tspan>
  </text>
  <text x="20" y="105" font-size="12" class="dim"># ships code. ships bugs. usually in that order.</text>

  <!-- ======== $ cat about.txt ======== -->
  <text x="20" y="131" font-size="13">
    <tspan class="green">yashwanth@sjsu</tspan><tspan class="dim"> ~ </tspan><tspan class="bgreen">%</tspan><tspan class="main"> cat about.txt</tspan>
  </text>
  <text x="20" y="152" font-size="13" class="main">I find gaps in systems, figure out why they exist, and close them.</text>
  <text x="20" y="171" font-size="13" class="main">Occasionally I'm the one who opened them -- but they always get fixed.</text>
  <text x="20" y="190" font-size="13" class="muted">Recent grad from SJSU. Building AI/ML that works in the real world.</text>

  <!-- ======== $ echo $OPEN_TO_WORK ======== -->
  <text x="20" y="216" font-size="13">
    <tspan class="green">yashwanth@sjsu</tspan><tspan class="dim"> ~ </tspan><tspan class="bgreen">%</tspan><tspan class="main"> echo $OPEN_TO_WORK</tspan>
  </text>
  <text y="236" font-size="13">
    <tspan x="20" class="bgreen">true</tspan><tspan class="dim">  # hire me before someone else does</tspan>
  </text>

  <!-- ======== $ cat contact.txt ======== -->
  <text x="20" y="262" font-size="13">
    <tspan class="green">yashwanth@sjsu</tspan><tspan class="dim"> ~ </tspan><tspan class="bgreen">%</tspan><tspan class="main"> cat contact.txt</tspan>
  </text>
  <text y="282" font-size="13"><tspan x="20" class="muted">email     </tspan><tspan class="blue">yashwanthreddykatipally@gmail.com</tspan></text>
  <text y="301" font-size="13"><tspan x="20" class="muted">linkedin  </tspan><tspan class="blue">yashwanth-katipally</tspan></text>
  <text y="320" font-size="13"><tspan x="20" class="muted">web       </tspan><tspan class="blue">yashwanth.net</tspan></text>

  <!-- ======== Final prompt + blinking cursor ======== -->
  <text x="20" y="352" font-size="13">
    <tspan class="green">yashwanth@sjsu</tspan><tspan class="dim"> ~ </tspan><tspan class="bgreen">% </tspan>
  </text>
  <!-- cursor: ~19 chars * 7.8px/char = 148px → x = 20 + 148 = 168 -->
  <rect x="170" y="338" width="8" height="16" rx="1" fill="#39D353" class="bgreen">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>
